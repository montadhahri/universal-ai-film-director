name: Local Skills CLI install smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/installation/**'
      - '.github/workflows/skills-install-smoke.yml'
      - 'docs/installation.md'
permissions:
  contents: read
jobs:
  local-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated skill using real Skills CLI from local private checkout
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/skills/universal-ai-film-director"
          scratch="$(mktemp -d)"
          cd "$scratch"
          npx --yes skills@1.7.4 add "$source_dir" -a codex -y --copy
          installed="$scratch/.agents/skills/universal-ai-film-director"
          test -f "$installed/SKILL.md"
          node "$GITHUB_WORKSPACE/tests/installation/check-installed.js" "$source_dir" "$installed"
      - name: Record scope of test
        run: echo "Local CLI install tested; private remote authentication and agent execution NOT tested."
