name: Reproducible marketing film showcase
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/marketing-showcase/**'
      - '.github/workflows/showcase-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg on clean runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check video dependencies
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -decoders | grep librsvg
      - name: Render original scripted animation
        run: node examples/marketing-showcase/render-demo.js build/marketing-showcase
      - name: Verify actual MP4 duration and audio/video streams
        run: |
          set -euo pipefail
          file=build/marketing-showcase/missing-umbrella.mp4
          test -s "$file"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$file"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$file" | grep -qx '960,540'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$file" | grep -qx audio
          duration=$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$file")
          awk -v d="$duration" 'BEGIN { exit !(d >= 29.9 && d <= 30.1) }'
      - name: Upload playable film for private review
        uses: actions/upload-artifact@v4
        with:
          name: missing-umbrella-rendered-demo
          path: build/marketing-showcase/missing-umbrella.mp4
          if-no-files-found: error
          retention-days: 14
