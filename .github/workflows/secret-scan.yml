name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch remote branches and tags for history coverage
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags --force origin
          echo "Remote branches included: $(git for-each-ref --count=100000 --format='%(refname)' refs/remotes/origin | wc -l)"
          echo "Tags included: $(git tag -l | wc -l)"
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin refs/tags | sort > /tmp/scanned-refs.txt
          test -s /tmp/scanned-refs.txt
      - name: Install pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan reachable git history across fetched refs
        run: /tmp/gitleaks git --redact --exit-code 1 --log-opts="--all" .
