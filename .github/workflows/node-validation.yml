name: Node validation parity (stages 1-3)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node.js preservation check
        run: node tests/regression/check_preservation.js
      - name: Run Node.js structure and links check
        run: node tests/validate_repo.js
      - name: Run Node.js negative and repository tests
        run: node --test tests/node/validation.test.js tests/node/regression.test.js tests/node/behavior.test.js tests/node/preprod.test.js

      - name: Evaluate synthetic fixtures with Node.js
        run: node tests/behavior/evaluate.js --json-out build/behavior-report-node.json
      - name: Run offline pre-production checks with Node.js
        run: node tests/preprod/run_validation.js --out build/preprod-validation-node.json
      - name: Upload Node.js validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-validation-reports
          path: |
            build/behavior-report-node.json
            build/preprod-validation-node.json
          if-no-files-found: warn
          retention-days: 14
