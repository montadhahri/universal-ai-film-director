name: Private pre-production validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/**'
      - 'engine/**'
      - 'adapters/**'
      - 'schemas/**'
      - 'templates/**'
      - 'docs/**'
      - 'examples/**'
      - 'SKILL.md'
      - '.github/workflows/preprod-validation.yml'

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline pre-production validation
        run: python tests/preprod/run_validation.py --out build/preprod-validation.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-preprod-validation
          path: |
            build/preprod-validation.json
            build/behavior-report.json
          if-no-files-found: warn
          retention-days: 14
