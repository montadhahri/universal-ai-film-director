name: Private pre-production validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/preprod-validation.yml'
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline pre-production validation
        run: node tests/preprod/run_validation.js --out build/preprod-validation.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-preprod-validation
          path: |
            build/preprod-validation.json
            build/behavior-report.json
            build/agent-acceptance.json
            build/quality-benchmark.json
          if-no-files-found: error
          retention-days: 14
