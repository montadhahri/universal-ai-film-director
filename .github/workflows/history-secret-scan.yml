name: Historical secret scan
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/history-secret-scan.yml'
      - 'scripts/history-secret-scan.js'
permissions:
  contents: read
jobs:
  history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan reachable Git history for credential patterns
        run: node scripts/history-secret-scan.js
