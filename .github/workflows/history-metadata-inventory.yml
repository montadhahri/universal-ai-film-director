name: Historical metadata and binary inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch branches and tags
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags --force origin
      - name: Syntax validation
        run: node --check scripts/security/history-metadata-inventory.js
      - name: Aggregate-only inventory
        run: node scripts/security/history-metadata-inventory.js
