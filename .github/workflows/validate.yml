name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate protected files
        run: node tests/regression/check_preservation.js
      - name: Validate repository structure and links
        run: node tests/validate_repo.js
      - name: Validate isolated skill payload
        run: node tests/package/validate-package.js
      - name: Run complete Node.js regression suite
        run: node --test tests/node/*.test.js
      - name: Evaluate deterministic transcript fixtures
        run: node tests/behavior/evaluate.js --json-out build/behavior-report.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-evaluation-report
          path: build/behavior-report.json
          if-no-files-found: error
          retention-days: 14
