name: Historical path inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inventory fetched history paths (counts only in logs)
        run: bash scripts/security/historical-path-inventory.sh
      - name: Publish sanitized counts to workflow summary
        shell: bash
        run: |
          # The script emits only aggregate counts in summary.md.
          # Never upload raw path lists: public-repository artifacts may expose sensitive filenames.
          cat audit-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove raw local inventory
        if: always()
        shell: bash
        run: rm -rf audit-output
